# main 브랜치에 push 하면 Cloudflare Workers 로 자동 배포합니다.
#
# 사용하려면 GitHub 저장소 Settings 에서 아래를 등록하세요.
#   Secrets:   CLOUDFLARE_API_TOKEN   (Cloudflare 대시보드 > My Profile > API Tokens
#                                      > "Edit Cloudflare Workers" 템플릿으로 발급)
#              CLOUDFLARE_ACCOUNT_ID  (Workers 대시보드 우측에 표시)
#   Variables: NEXT_PUBLIC_SITE_URL   (예: https://koryo-tax-web.내계정.workers.dev)
#              NEXT_PUBLIC_NOINDEX    (임시 미리보기면 1, 정식 공개면 비워두기)
#
# ※ NEXT_PUBLIC_* 은 빌드 시점에 값이 박히므로 반드시 build 단계에서 넘겨야 합니다.

name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Cloudflare 자격증명을 아직 등록하지 않았으면 조용히 건너뜁니다.
      # (설정 전에는 빨간 실패 대신 안내만 남기도록)
      - name: Cloudflare 자격증명 확인
        id: creds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID 시크릿이 없어 배포를 건너뜁니다. 저장소 Settings > Secrets and variables > Actions 에서 등록하세요."
          fi

      - uses: actions/checkout@v7
        if: steps.creds.outputs.ready == 'true'

      - uses: actions/setup-node@v7
        if: steps.creds.outputs.ready == 'true'
        with:
          node-version: 24
          cache: npm

      - run: npm ci
        if: steps.creds.outputs.ready == 'true'

      - name: Build (OpenNext + Next.js)
        if: steps.creds.outputs.ready == 'true'
        run: npx opennextjs-cloudflare build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_NOINDEX: ${{ vars.NEXT_PUBLIC_NOINDEX }}

      - name: Deploy
        if: steps.creds.outputs.ready == 'true'
        run: npx opennextjs-cloudflare deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
